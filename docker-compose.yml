version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: property-rag-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-3.5-turbo
      - EMBEDDING_MODEL=text-embedding-3-small
      - DATA_BASE_PATH=/app/data
      - CHROMA_DB_PATH=/app/chroma_db
    volumes:
      - ./data:/app/data:ro
      - ./backend/chroma_db:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - property-rag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: property-rag-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:8000
    networks:
      - property-rag-network

networks:
  property-rag-network:
    driver: bridge

volumes:
  chroma_db:
